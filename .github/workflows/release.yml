name: Release

# Builds every installer on a version tag and publishes them as a GitHub
# release. Windows is the reason this lives here rather than on a laptop:
# packaging NSIS from macOS needs Wine, whereas a windows-latest runner just
# builds it.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            args: --mac dmg --arm64 --x64
            pattern: dist/*.dmg
          - os: windows-latest
            name: Windows
            args: --win nsis --x64
            pattern: dist/*.exe

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Run on both runners, not once on Linux. The bugs worth catching here are
      # the ones that only exist on one platform — path encoding, quoting a
      # command for cmd.exe — and those are invisible everywhere else.
      - run: npm test

      - name: Build
        env:
          # macOS: sign with the Developer ID cert and notarize with Apple.
          # electron-builder does both automatically once these are set —
          # see MacTargetHelper.getNotarizeOptions in app-builder-lib.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          # Windows: still unsigned — no cert for it, and electron-builder
          # otherwise stops on this runner to look for an identity it will
          # not find.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'windows-latest' && 'false' || 'true' }}
        # bash on both runners, so the failure handling is written once.
        shell: bash
        # Report first, because job logs need admin rights on the repository:
        # without this a signing failure is a red cross with no reason attached.
        # Whether the secrets are even set is visible here and nowhere else.
        run: |
          set -o pipefail
          if ! npx electron-builder ${{ matrix.args }} --publish never 2>&1 | tee build.log; then
            echo "::error title=electron-builder failed::$(tail -n 25 build.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "macOS build is signed and notarized by Apple — it opens normally. Windows build is unsigned: Windows will warn on first launch (More info → Run anyway). See the About page in the app for the full disclaimer."
