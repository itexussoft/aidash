name: Release

# Builds every installer on a version tag and publishes them as a GitHub
# release. Windows is the reason this lives here rather than on a laptop:
# packaging NSIS from macOS needs Wine, whereas a windows-latest runner just
# builds it.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            args: --mac dmg --arm64 --x64
            pattern: dist/*.dmg
          - os: windows-latest
            name: Windows
            args: --win nsis --x64
            pattern: dist/*.exe

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Run on both runners, not once on Linux. The bugs worth catching here are
      # the ones that only exist on one platform — path encoding, quoting a
      # command for cmd.exe — and those are invisible everywhere else.
      - run: npm test

      - name: Build
        env:
          # macOS: sign with the Developer ID cert and notarize with Apple.
          # electron-builder does both automatically once these are set —
          # see MacTargetHelper.getNotarizeOptions in app-builder-lib.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          # Windows: still unsigned — no cert for it, and electron-builder
          # otherwise stops on this runner to look for an identity it will
          # not find.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'windows-latest' && 'false' || 'true' }}
        # bash on both runners, so the failure handling is written once.
        shell: bash
        # Report first, because job logs need admin rights on the repository:
        # without this a signing failure is a red cross with no reason attached.
        # Whether the secrets are even set is visible here and nowhere else.
        run: |
          set -o pipefail
          if ! npx electron-builder ${{ matrix.args }} --publish never 2>&1 | tee build.log; then
            # The reason is the last thing printed, and electron-builder marks it
            # with a heavy cross. Take both: the marked lines, then the tail as a
            # fallback for a failure that carries no marker.
            echo "::error title=electron-builder failed::$(grep -aE '⨯|Error:|error:' build.log | tail -n 6 | tr '\n' ' ' | tail -c 800)"
            echo "::error title=build.log tail::$(tail -c 800 build.log | tr '\n' ' ')"
            exit 1
          fi

      # electron-builder notarizes and staples the .app, but not the disk image
      # it then wraps it in. That left the shipped dmg with no ticket of its own,
      # so macOS still questioned the download even though the app inside was
      # fine. Notarizing the container too is what removes the last prompt.
      #
      # This runs before the upload on purpose: stapling rewrites the file, so a
      # dmg uploaded earlier would be the unstapled one.
      - name: Notarize and staple the disk images
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          for dmg in dist/*.dmg; do
            echo "→ $dmg"
            if ! xcrun notarytool submit "$dmg" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --wait 2>&1 | tee notarize.log; then
              # Apple's rejection reason lives in the log it keeps, not in the
              # submit output, so fetch it before failing.
              id=$(grep -oE '\b[0-9a-f-]{36}\b' notarize.log | head -1)
              [ -n "$id" ] && xcrun notarytool log "$id" \
                --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" 2>&1 | tail -c 700 > reason.log || true
              echo "::error title=notarization failed::$(tail -c 500 notarize.log | tr '\n' ' ') $(cat reason.log 2>/dev/null | tr '\n' ' ')"
              exit 1
            fi
            xcrun stapler staple "$dmg"
            # Prove it rather than assume it: an unstapled dmg would otherwise
            # ship looking identical to a stapled one.
            xcrun stapler validate "$dmg"
            spctl -a -t open --context context:primary-signature -v "$dmg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "macOS build is signed and notarized by Apple — the disk image and the app both carry a stapled ticket, so it opens with no warning. Windows build is unsigned: Windows will warn on first launch (More info → Run anyway). See the About page in the app for the full disclaimer."
