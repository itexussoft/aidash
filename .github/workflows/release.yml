name: Release

# Builds every installer on a version tag and publishes them as a GitHub
# release. Windows is the reason this lives here rather than on a laptop:
# packaging NSIS from macOS needs Wine, whereas a windows-latest runner just
# builds it.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            args: --mac dmg --arm64 --x64
            pattern: dist/*.dmg
          - os: windows-latest
            name: Windows
            args: --win nsis --x64
            pattern: dist/*.exe

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Run on both runners, not once on Linux. The bugs worth catching here are
      # the ones that only exist on one platform — path encoding, quoting a
      # command for cmd.exe — and those are invisible everywhere else.
      - run: npm test

      - name: Build
        # Nothing here is signed, and electron-builder otherwise stops to look
        # for an identity it will not find.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Unsigned builds. macOS will warn on first launch: right-click the app and choose Open. See the About page in the app for the full disclaimer."
