# Builds the installers on a tag and attaches them to the release.
#
# macOS artefacts can be built by hand with `npm run release`, but Windows
# cannot: electron-builder needs Wine to package NSIS from a Mac, so that build
# has to happen on a Windows runner. Both jobs are here so a tag produces a
# complete release once runners exist.
#
# Requires a CI/CD variable GITLAB_TOKEN with api scope.

stages: [build, release]

variables:
  PACKAGE: aidash
  REGISTRY: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/aidash/${CI_COMMIT_TAG}

.only-tags:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

build:mac:
  extends: .only-tags
  stage: build
  tags: [macos]
  script:
    - npm ci
    - npx electron-builder --mac dmg --arm64 --x64 --publish never
    - |
      for f in dist/*.dmg; do
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$REGISTRY/$(basename "$f")"
      done
  artifacts:
    paths: [dist/*.dmg]
    expire_in: 1 week

build:windows:
  extends: .only-tags
  stage: build
  tags: [windows]
  script:
    - npm ci
    - npx electron-builder --win nsis --x64 --publish never
    - |
      for f in dist/*.exe; do
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$REGISTRY/$(basename "$f")"
      done
  artifacts:
    paths: [dist/*.exe]
    expire_in: 1 week

# Assets are links into the package registry rather than uploads, so the release
# stays small and the URLs are the same ones the landing page points at.
release:
  extends: .only-tags
  stage: release
  needs: ['build:mac', 'build:windows']
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: 'aidash $CI_COMMIT_TAG'
    assets:
      links:
        - name: macOS (Apple Silicon)
          url: ${REGISTRY}/aidash-${CI_COMMIT_TAG}-arm64.dmg
        - name: macOS (Intel)
          url: ${REGISTRY}/aidash-${CI_COMMIT_TAG}.dmg
        - name: Windows (64-bit)
          url: ${REGISTRY}/aidash%20Setup%20${CI_COMMIT_TAG}.exe
